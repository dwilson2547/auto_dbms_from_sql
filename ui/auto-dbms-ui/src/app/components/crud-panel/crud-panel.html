<div class="panel" [class.expanded]="expanded()">
  <button
    class="panel-header"
    (click)="toggle()"
    [attr.aria-expanded]="expanded()"
    [attr.data-testid]="'panel-toggle-' + config().operation"
  >
    <span class="panel-label">{{ config().label }}</span>
    <span class="panel-desc">{{ config().description }}</span>
    <span class="panel-chevron">{{ expanded() ? '▲' : '▼' }}</span>
  </button>

  @if (expanded()) {
    <div class="panel-body">
      @if (requiresId) {
        <div class="field-group">
          <label class="field-label" for="id-{{ config().operation }}">ID</label>
          <input
            id="id-{{ config().operation }}"
            class="field-input"
            type="text"
            placeholder="Enter record ID"
            [value]="idInput()"
            (input)="onIdChange($event)"
            [attr.data-testid]="'id-input-' + config().operation"
          />
        </div>
      }

      @if (requiresBody) {
        <div class="field-group">
          <label class="field-label" for="body-{{ config().operation }}">Request Body (JSON)</label>
          <textarea
            id="body-{{ config().operation }}"
            class="field-textarea"
            rows="6"
            placeholder='{}'
            [value]="jsonInput()"
            (input)="onJsonChange($event)"
            [attr.data-testid]="'json-input-' + config().operation"
          ></textarea>
        </div>
      }

      @if (loading()) {
        <p class="status-msg" [attr.data-testid]="'status-loading-' + config().operation">Loading…</p>
      }

      @if (errorMsg()) {
        <p class="status-msg error" [attr.data-testid]="'status-error-' + config().operation">{{ errorMsg() }}</p>
      }

      @if (result() !== null && !loading()) {
        <div class="result-block" [attr.data-testid]="'result-block-' + config().operation">
          <p class="result-label">Response</p>
          <pre class="result-pre" [attr.data-testid]="'result-pre-' + config().operation">{{ resultJson }}</pre>
        </div>
      }
    </div>
  }
</div>
