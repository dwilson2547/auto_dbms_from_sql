<div class="container">
  <a class="back-link" routerLink="/" data-testid="back-link">← Back to Entities</a>

  @if (loading()) {
    <p class="status-msg" data-testid="status-loading">Loading…</p>
  } @else if (error()) {
    <p class="status-msg error" data-testid="status-error">{{ error() }}</p>
  } @else {
    <h1 class="page-title" data-testid="entity-detail-title">{{ entityName() }}</h1>
    <p class="page-subtitle">CRUD operations for <strong>{{ entityPath() }}</strong></p>

    <div class="panels">
      @for (panel of panels; track panel.operation) {
        <div class="panel-wrapper">
          <app-crud-panel #crudPanel [config]="panel" [entityPath]="entityPath()" />
          @if (crudPanel.expanded()) {
            <div class="panel-footer">
              <button
                class="btn btn-primary"
                (click)="execute(crudPanel)"
                [disabled]="crudPanel.loading()"
                [attr.data-testid]="'execute-btn-' + panel.operation"
              >
                {{ crudPanel.loading() ? 'Loading…' : 'Execute' }}
              </button>
            </div>
          }
        </div>
      }
    </div>
  }
</div>
