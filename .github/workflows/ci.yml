name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  detect-changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ui: ${{ steps.filter.outputs.ui }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ui:
              - 'ui/**'

  test-python:
    name: Python tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui/auto-dbms-ui/package-lock.json

      - name: Install Angular dependencies
        run: npm ci
        working-directory: ui/auto-dbms-ui

      - name: Install app dependencies
        run: pip install -r app/requirements.txt

      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Run tests
        run: pytest tests/ -v --run-ui

  build-and-test-ui:
    name: Angular build and test
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.ui == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui/auto-dbms-ui/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ui/auto-dbms-ui

      - name: Build
        run: npm run build
        working-directory: ui/auto-dbms-ui

      - name: Test
        run: npm test -- --watch=false --browsers=ChromeHeadless
        working-directory: ui/auto-dbms-ui

  docker-snapshot-ui:
    name: Publish snapshot UI image
    runs-on: ubuntu-latest
    needs: [detect-changes, build-and-test-ui]
    if: github.event_name == 'pull_request' && needs.detect-changes.outputs.ui == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push snapshot image
        uses: docker/build-push-action@v6
        with:
          context: ui/auto-dbms-ui
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/auto-dbms-ui:snapshot-pr${{ github.event.pull_request.number }}
