name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main

jobs:
  detect-changes:
    name: Detect changed paths
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for app changes since last release
        id: filter
        run: |
          latest=$(git tag -l 'v*' --sort=-v:refname | head -1)
          if [ -z "$latest" ]; then
            base=$(git rev-list --max-parents=0 HEAD)
          else
            base="$latest"
          fi
          if git diff --quiet "$base" HEAD -- app/; then
            echo "app=false" >> "$GITHUB_OUTPUT"
          else
            echo "app=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Tag and release
    needs: detect-changes
    if: needs.detect-changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.next }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next version
        id: version
        run: |
          latest=$(git tag -l 'v*' --sort=-v:refname | head -1)
          if [ -z "$latest" ] || ! [[ "$latest" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "next=v1.0.0" >> "$GITHUB_OUTPUT"
          else
            version="${latest#v}"
            IFS='.' read -r major minor patch <<< "$version"
            patch=$((patch + 1))
            echo "next=v${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.version.outputs.next }}"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists – skipping."
          else
            gh release create "$tag" \
              --title "Release $tag" \
              --generate-notes
          fi

  docker-release-ui:
    name: Publish release UI image
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push release image
        uses: docker/build-push-action@v6
        with:
          context: ui/auto-dbms-ui
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/auto-dbms-ui:${{ needs.release.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/auto-dbms-ui:latest
